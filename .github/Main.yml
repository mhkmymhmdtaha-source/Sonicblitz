name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download fonts (so the game looks right offline)
        continue-on-error: true
        run: |
          cd app/src/main/assets/fonts
          curl -fsSL -o TitanOne-Regular.ttf  https://raw.githubusercontent.com/google/fonts/main/ofl/titanone/TitanOne-Regular.ttf
          curl -fsSL -o LilitaOne-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/lilitaone/LilitaOne-Regular.ttf
          curl -fsSL -o Vazirmatn.ttf         'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf'
          ls -la

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SonicBlitz-APK
          path: app/build/outputs/apk/debug/app-debug.apk
